---
- name: Version network device configurations
  hosts: routers
  gather_facts: false

  tasks:

    - name: Get current running configuration
      ansible.builtin.command:
        cmd: vtysh -c "show running-config"
      register: running_config
      changed_when: false

    - name: Create timestamp
      ansible.builtin.set_fact:
        backup_timestamp: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"

    - name: Create router backup directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../backups/{{ inventory_hostname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Save timestamped configuration
      ansible.builtin.copy:
        content: "{{ running_config.stdout }}"
        dest: "{{ playbook_dir }}/../backups/{{ inventory_hostname }}/{{ backup_timestamp }}.cfg"
        mode: "0644"
      delegate_to: localhost

    - name: Update latest configuration
      ansible.builtin.copy:
        content: "{{ running_config.stdout }}"
        dest: "{{ playbook_dir }}/../backups/{{ inventory_hostname }}/running-config.txt"
        mode: "0644"
      delegate_to: localhost

    - name: Display backup information
      ansible.builtin.debug:
        msg: "Backup created for {{ inventory_hostname }} at {{ backup_timestamp }}"
